# litellm_config.yaml -- MACF unified gateway (rebuilt 2026-09-29)
# =============================================================================
# Self-hosted LiteLLM (OpenAI-compatible) gateway on :4000.
#
# DEFAULT ROUTING -- BUDGET-FIRST (Jesse's directive, 2026-09-29):
# This is the DEFAULT out-of-the-box routing for MACF. Zero API budget required:
# a fresh install with only Ollama works. Each layer is tried in order; the
# first success wins. Premium/paid paths are the exception, not the rule.
#
# Full default chain (runtime layer + gateway layer):
#   1. LOCAL -- Ollama qwen2.5:3b-instruct-q4_K_M (GTX 980, 4GB VRAM). Free.
#      STATUS 2026-09-29: DEGRADED. Ollama's GPU discovery times out on the
#      GTX 980 (Maxwell), forcing CPU fallback; CPU inference is too slow
#      (>120s) for gateway use. Local deployments are COMMENTED OUT below
#      until the GPU issue is resolved. macf-cheap is preserved as a
#      local-only tier for when Ollama is fixed. (qwen3.5:4b also timed out
#      on trivial prompts -- NOT the default until tested.)
#   2. DESKTOP-APP SUBSCRIPTIONS -- handled UPSTREAM in the Slack runtime
#      (utils/litellm-gateway.js: routeViaClaudeSubscription), riding Jesse's
#      Claude subscription via Claude Code OAuth at $0 marginal cost.
#      NOT in this file -- the runtime tries it before calling the gateway.
#      See docs/routing/desktop-subscription-bridge.md for feasibility notes.
#   3. OPENROUTER -- 3rd-party aggregator. Free-tier models first; paid models
#      are overflow for when credits are added. Configured ready below.
#   4. DIRECT PAID APIs (last resort) -- Meta Muse (api.meta.ai), Gemini,
#      Claude. Per-token costs; only when everything above fails.
#      NOTE: the Anthropic PAYG key is $0 -- those deployments fail fast and
#      fall through; kept in chain so they work if the key is ever funded.
#
# AUTH: no general_settings.master_key. The gateway is localhost-only and
# LiteLLM's key auth requires Prisma (not installed) -- with a master key set,
# EVERY request 500s with "No module named 'prisma'". No auth = no breakage.
# Provider keys come from macf_gateway.env via deploy_model_router.ps1.
# NO SECRETS IN THIS FILE (all via os.environ/...).
# =============================================================================

model_list:
  # ---- macf-cheap: local Qwen only. Routine/fast work. $0. -----------------
  - model_name: macf-cheap
    litellm_params:
      model: ollama/qwen2.5:3b-instruct-q4_K_M
      api_base: os.environ/OLLAMA_URL

  # ---- macf-smart: OpenRouter (free) -> direct APIs -----------------------
  #      (local commented out 2026-09-29: Ollama GPU broken, see header) -----
  # - model_name: macf-smart
  #   litellm_params:
  #     model: ollama/qwen2.5:3b-instruct-q4_K_M
  #     api_base: os.environ/OLLAMA_URL
  - model_name: macf-smart
    litellm_params:
      model: openrouter/deepseek/deepseek-chat-v3-0324:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: macf-smart
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: macf-smart
    litellm_params:
      model: openai/muse-spark-1.3
      api_base: https://api.meta.ai/v1
      api_key: os.environ/META_API_KEY
  - model_name: macf-smart
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: macf-smart
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # ---- macf-best: hardest work. OpenRouter (paid, then free) -> direct ----
  #      (local commented out 2026-09-29: Ollama GPU broken, see header) -----
  # - model_name: macf-best
  #   litellm_params:
  #     model: ollama/qwen2.5:3b-instruct-q4_K_M
  #     api_base: os.environ/OLLAMA_URL
  - model_name: macf-best
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: macf-best
    litellm_params:
      model: openrouter/deepseek/deepseek-chat
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: macf-best
    litellm_params:
      model: openrouter/deepseek/deepseek-chat-v3-0324:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: macf-best
    litellm_params:
      model: openai/muse-spark-1.3
      api_base: https://api.meta.ai/v1
      api_key: os.environ/META_API_KEY
  - model_name: macf-best
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: macf-best
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  # ---- macf-muse: Meta Muse direct (explicit hardest-task routing) ---------
  - model_name: macf-muse
    litellm_params:
      model: openai/muse-spark-1.3
      api_base: https://api.meta.ai/v1
      api_key: os.environ/META_API_KEY

# ---- Cross-tier failover (if a whole tier's chain is exhausted) -------------
router_settings:
  fallbacks:
    - {"macf-cheap": ["macf-smart"]}
    - {"macf-smart": ["macf-best", "macf-cheap"]}
    - {"macf-best": ["macf-smart", "macf-cheap"]}
    - {"macf-muse": ["macf-best", "macf-smart"]}
  allowed_fails: 2
  cooldown_time: 30

litellm_settings:
  drop_params: true
  request_timeout: 120
  num_retries: 2
